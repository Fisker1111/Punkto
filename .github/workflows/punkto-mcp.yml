name: Punkto MCP
on:
  pull_request:
    paths:
      - 'integrations/punkto-mcp/**'
      - '.github/workflows/punkto-mcp.yml'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/punkto-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/punkto-mcp/package-lock.json
      - run: npm ci
      - run: npm test
