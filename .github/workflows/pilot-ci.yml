name: Pilot CI

on:
  push:
    branches:
      - pilot-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-validation:
    name: PWA validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record tested SHA
        run: |
          echo "Testing commit: $GITHUB_SHA"
          echo "## Pilot CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: PWA JavaScript syntax checks
        run: |
          node --check pwa/app.js
          node --check pwa/ui-shell.js
          node --check pwa/ui-text.js
          node --check pwa/ui-map.js
          node --check pwa/ui-create.js
          node --check pwa/key-management.js
          node --check pwa/sw.js

      - name: Parse app.js explicitly as an ES module
        run: node --input-type=module --check < pwa/app.js

      - name: Required Pilot files exist
        run: |
          for f in \
            AGENTS.md \
            pwa/app.js \
            pwa/ui-shell.js \
            pwa/ui-text.js \
            pwa/ui-map.js \
            pwa/ui-create.js \
            docs/PILOT_1_IMPLEMENTATION.md; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required Pilot file missing"
              exit 1
            fi
          done

      - name: Summary
        if: success()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ PWA validation passed for exact SHA \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          echo "This is the hard pre-deploy gate for Pilot_1." >> "$GITHUB_STEP_SUMMARY"

  relay-tests:
    name: Relay regression report
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install relay test dependencies
        run: python -m pip install requests PyYAML cryptography

      - name: Run relay suite
        run: python3 relay/test_relay.py

      - name: Baseline note
        if: failure()
        run: |
          echo "::warning::Relay suite currently has known pre-existing baseline failures. This job is informational until that debt is fixed; PWA validation remains the Pilot_1 hard deploy gate."
          echo "⚠️ Relay suite reported failures. Review them before any relay/protocol change is approved." >> "$GITHUB_STEP_SUMMARY"
