name: Punkto image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r node/requirements.txt requests
      - run: python -m unittest discover -s experimental/punkti-v0.6-mesh/tests
      - run: python -m unittest punkti_node.test_node punkti_node.test_web
      - run: python experimental/punkti-v0.6-mesh/tests/measure.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pwa/test-punkti-client.mjs
      - run: node pwa/test-slice5.mjs
      - run: |
          for test in relay/test_*.py tools/test_*.py; do
            test_data=$(mktemp -d)
            PUNKTO_DATA_DIR="$test_data" PUNKTO_NODE_KEY="$test_data/key.json" PUNKTO_ATOM_LOG_PATH="$test_data/atoms.jsonl" python "$test"
            rm -rf "$test_data"
          done
      - run: |
          for module in pwa/*.js pwa/sync/*.js pwa/storage/*.js; do node --check "$module"; done
          node --input-type=module --check < pwa/app.js
      - run: |
          cmp experimental/punkti-v0.6-mesh/src/carrier.py punkti_node/carrier.py
          cmp experimental/punkti-v0.6-mesh/src/spatial.py punkti_node/spatial.py
          python -m punkti_node --check-config --config node-config.example.yml
          PUNKTO_WEB_ROOT="$PWD/pwa" python -m punkti_node --check-config --config punkto-config.example.yml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/fisker1111/punkto
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=preview,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
