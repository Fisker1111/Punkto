name: AI static preflight unit tests
on:
  pull_request:
    paths:
      - 'scripts/qa/**'
      - '.github/workflows/ai-preflight.yml'
  workflow_dispatch:
jobs:
  preflight-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python 3 stdlib preflight tests
        run: python3 -m unittest discover -s scripts/qa/tests -v
  public-readonly-diagnostic:
    runs-on: ubuntu-latest
    # Diagnosis only: production may legitimately be serving a previous protocol.
    # Never fail a code PR because an external endpoint is unreachable.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: GET-only public entrance and publication probe (non-blocking)
        id: probe
        continue-on-error: true
        run: |
          exit_code=0
          python3 scripts/qa/ai_preflight.py --timeout 4 > ai-preflight-live.json 2>&1 || exit_code=$?
          cat ai-preflight-live.json
          echo "Preflight diagnostic exit code: $exit_code"
          exit "$exit_code"
      - name: Publish observed read-only result
        if: always()
        run: |
          echo "## Read-only public Punkti AI preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a diagnostic, not a release approval and never submits atoms." >> "$GITHUB_STEP_SUMMARY"
          echo "Probe outcome: ${{ steps.probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s ai-preflight-live.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat ai-preflight-live.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare public routes without writing
        if: always()
        run: |
          echo "## Public route matrix (GET, no submit)" >> "$GITHUB_STEP_SUMMARY"
          for url in \
            https://punkto.xyz/ai \
            https://www.punkto.xyz/ai \
            https://punkto.xyz/nodes.json \
            https://www.punkto.xyz/nodes.json \
            https://node1.punkto.xyz/health \
            https://node2.punkto.xyz/health \
            https://test2.punkto.xyz/ai \
            https://test2.punkto.xyz/nodes.json \
            https://punkto.xyz/ \
            https://node1.punkto.xyz/publication/root.json \
            https://node2.punkto.xyz/publication/root.json; do
              code=$(curl -sSL -m 6 -o /dev/null -w '%{http_code}' "$url" || true)
              printf '%s %s\n' "$code" "$url" | tee -a route-matrix.txt
          done
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat route-matrix.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Run isolated staging read-only publication preflight
        id: staging_probe
        if: always()
        continue-on-error: true
        run: |
          exit_code=0
          python3 scripts/qa/ai_preflight.py --timeout 4 --ai-url https://test2.punkto.xyz/ai --nodes-url https://test2.punkto.xyz/nodes.json > ai-preflight-staging.json 2>&1 || exit_code=$?
          cat ai-preflight-staging.json
          exit "$exit_code"
      - name: Publish isolated staging result
        if: always()
        run: |
          echo "## Isolated staging read-only preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.staging_probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s ai-preflight-staging.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat ai-preflight-staging.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
