# Public-safe future deployment example; requires operator DNS/TLS/proxy setup.
# Uses exactly the generic image. No seed nodes or secrets are embedded.
node:
  name: example-node
  public_url: https://node.example
  description: Punkti draft Mesh node operated at node.example
  operator_contact: ""
network:
  listen_host: 0.0.0.0
  listen_port: 8000
  advertise_url: https://node.example
  peers: [] # Add mutually configured compatible draft Mesh origins when available.
  sync_interval_seconds: 30
subscriptions:
  - h_lo: null
    h_hi: null
    z_min: null
    z_max: null
storage:
  data_path: /data
logging:
  level: info
branding:
  display_name: node.example

# Local UI hosting; disabled for the node-only image.
web:
  enabled: false
  root: /srv/pwa
  spa_fallback: false
