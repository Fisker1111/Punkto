# ── Punkto — Docker Compose ───────────────────────────────────────────────────
# Three services per node:
#   web     — Caddy serves static + proxies relay + atom API
#   relay   — legacy Python relay (Explorer / old /atom /latest /feed)
#   atoms   — Punkti v0.5.1 canonical atom store (SQLite) + peer sync
# ─────────────────────────────────────────────────────────────────────────────

name: punkto

services:

  # ── Web server (Caddy) ──────────────────────────────────────────────────────
  web:
    image: ghcr.io/fisker1111/punkto-web:${PUNKTO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/punkto-test1:/srv-test1:ro
      - /var/www/punkto-world-v0:/srv-punkto-world:ro
      - /var/www/punkto-v1:/srv-punkto-v1:ro
      - /var/www/punkto-explorer:/srv-punkto-explorer:ro
      - ./overrides/app.js:/srv/app.js:ro
    depends_on:
      relay:
        condition: service_healthy
      atoms:
        condition: service_healthy
    networks:
      - punkto_internal

  # ── Relay node (Python, legacy) ─────────────────────────────────────────────
  relay:
    image: ghcr.io/fisker1111/punkto-relay:${PUNKTO_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - relay_data:/data
      - ./config/punkto-node.yml:/config/punkto-node.yml:ro
    environment:
      PUNKTO_HOST: "0.0.0.0"
      PUNKTO_PORT: "8000"
      PUNKTO_NODE_NAME: ${PUNKTO_NODE_NAME:-punkto-node}
      PUNKTO_PEERS: ${PUNKTO_PEERS:-}
      PUNKTO_BUFFER_ATOMS: ${PUNKTO_BUFFER_ATOMS:-10000}
      PUNKTO_BUFFER_HOURS: ${PUNKTO_BUFFER_HOURS:-168}
      PUNKTO_SYNC_INTERVAL: ${PUNKTO_SYNC_INTERVAL:-30}
      PUNKTO_DATA_DIR: "/data"
      PUNKTO_REQUIRE_SIG: ${PUNKTO_REQUIRE_SIG:-false}
    networks:
      - punkto_internal
    expose:
      - "8000"

  # ── Punkti v0.5.1 canonical atom store (SQLite) + peer sync ─────────────────
  atoms:
    image: punkto-atoms:1.1
    restart: unless-stopped
    volumes:
      # Canonical atom store — named volume so data survives container upgrades
      - atoms_data:/data
    environment:
      PUNKTO_ATOMS_PORT: "8020"
      PUNKTO_ATOMS_DB: "/data/atoms.db"
      PUNKTO_NODE_NAME: ${PUNKTO_NODE_NAME:-punkto-node}
      PUNKTO_ATOMS_PEERS: ${PUNKTO_ATOMS_PEERS:-}
      PUNKTO_ATOMS_SYNC_INTERVAL: ${PUNKTO_ATOMS_SYNC_INTERVAL:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8020/atoms/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - punkto_internal
    expose:
      - "8020"

volumes:
  caddy_data:    # TLS certificates — survives container rebuilds
  caddy_config:  # Caddy admin state
  relay_data:    # Legacy relay atom store
  atoms_data:    # Punkti v0.5.1 canonical atom store — critical, never delete

networks:
  punkto_internal:
    driver: bridge
