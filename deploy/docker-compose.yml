# ── Punkto — single-image Docker Compose ──────────────────────────────────────
# Runs one combined service that serves:
# - bundled PWA
# - node submit/health endpoints
# - static publication (/publication/*)
#
# Use digest-pinned images only. Example:
#   PUNKTO_IMAGE=ghcr.io/fisker1111/punkto@sha256:<digest>
#   docker compose pull && docker compose up -d --force-recreate

name: punkto

services:
  app:
    image: ${PUNKTO_IMAGE:?Set PUNKTO_IMAGE to a digest-pinned image reference}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ./config.yml:/config/punkto-node.yml:ro
      - ./data:/data
    environment:
      PUNKTO_NODE_CONFIG: /config/punkto-node.yml
      PUNKTO_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen;urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
